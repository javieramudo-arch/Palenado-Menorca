name: Comprobar y publicar Paleando Menorca
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar código y distancias
        run: |
          node --check app.js
          node --check backend.js
          node --check core.js
          node --check coastal.js
          npm ci --ignore-scripts
          node --test tests/days-adventure.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador de pruebas
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Probar los flujos de interfaz con backend simulado
        run: python tests/days_adventure_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-navegador
          path: tests/*.png
      - name: Consultar proveedores meteorológicos reales (solo lectura)
        run: |
          node tests/live-forecast.mjs
          node tests/live-windy.mjs
      - name: Preparar publicación
        run: |
          mkdir _site
          cp index.html style.css app.js core.js backend.js adventure.js windy.js route-features.js forecast.js install.js sw.js icon-192.png icon-512.png coastal.js coast-data.js coast-progress.js logo.webp sup-pattern.svg icon.svg guide-photo.svg manifest.webmanifest .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar la página publicada por HTTPS
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}" -o /tmp/paleando-live.html
          python3 -c "from pathlib import Path; text=Path('/tmp/paleando-live.html').read_text(); assert 'Paleando Menorca' in text and 'app.js' in text"
          curl --fail --silent --show-error --retry 3 "${SITE_URL}app.js" -o /tmp/paleando-live.js
